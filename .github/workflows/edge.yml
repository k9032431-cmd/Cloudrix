name: Edge builds

# Every push publishes prebuilt binaries to a rolling pre-release
# "edge-<branch>", so servers update in seconds instead of compiling.
on:
  push:
    branches: ['**']

permissions:
  contents: write

concurrency:
  group: edge-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - run: go test ./...
      - name: Build binaries
        run: |
          short=${GITHUB_SHA::7}
          mkdir -p dist
          for arch in amd64 arm64; do
            rm -rf build && mkdir build
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/k9032431-cmd/cloudrix/internal/api.Version=git-$short" \
              -o build/cloudrix ./cmd/cloudrix
            cp install.sh build/install.sh
            echo "$GITHUB_SHA" > build/REF
            tar -czf dist/cloudrix-linux-$arch.tar.gz -C build cloudrix install.sh REF
          done
      - name: Publish edge pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="edge-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/* --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Edge build: $GITHUB_REF_NAME @ ${GITHUB_SHA::7}" \
            --notes "Automatic build of $GITHUB_REF_NAME at $GITHUB_SHA. Used by cloudrix-manager update."
