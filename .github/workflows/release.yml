name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - run: go test ./...
      - name: Build binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/k9032431-cmd/cloudrix/internal/api.Version=${GITHUB_REF_NAME}" \
              -o build/cloudrix ./cmd/cloudrix
            cp install.sh build/install.sh
            echo "$GITHUB_REF_NAME" > build/REF
            tar -czf dist/cloudrix-linux-$arch.tar.gz -C build cloudrix install.sh REF
          done
          cp install.sh dist/install.sh
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
